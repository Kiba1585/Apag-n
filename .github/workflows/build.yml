name: Build APK (Manual)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - ambos

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Borrar artifact debug anterior
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'ambos' }}
        uses: geekyeggo/delete-artifact@v5
        continue-on-error: true
        with:
          name: corriente-debug-apk
          failOnError: false

      - name: Borrar artifact release anterior
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'ambos' }}
        uses: geekyeggo/delete-artifact@v5
        continue-on-error: true
        with:
          name: corriente-release-apk
          failOnError: false

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'ambos' }}
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'ambos' }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK (Debug)
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'ambos' }}
        uses: actions/upload-artifact@v4
        with:
          name: corriente-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          overwrite: true

      - name: Upload APK (Release)
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'ambos' }}
        uses: actions/upload-artifact@v4
        with:
          name: corriente-release-apk
          # AQUI ESTÁ LA CORRECCIÓN: ahora apunta al firmado, no al -unsigned
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          overwrite: true